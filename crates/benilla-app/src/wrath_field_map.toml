# Wrath (3.3.5a, 12340) -> 1.12 descriptor field table.
#
# Each rule copies a delivered Wrath word onto a 1.12 index:
#   for i in 0..count: if Wrath word `from + i` was delivered,
#     1.12 word `to + i` = (word >> shift) & mask
# `shift` defaults to 0, `mask` to 0xFFFFFFFF, `count` to 1.
#
# Sections: [[unit]] (creatures and players), [[player]] (players only, read from the full
# player window), [[gameobject]], [[dynamicobject]], [[corpse]]. Rules run after the
# hand-written projection in wrath.rs, in file order, so the last rule for an index wins.
#
# Live overlay: put a file with the same format at <benilla-config>/wrath-field-map.toml. It is
# re-read within a second of saving and applied after these rules (or instead of them with
# `replace_defaults = true` at the top). A file that does not parse is logged and ignored.

# CGGameObjectData (Wrath 6..17) -> 1.12 GameObject descriptor.
[[gameobject]] # OBJECT_FIELD_CREATED_BY
from = 6
to = 6
count = 2

[[gameobject]] # GAMEOBJECT_DISPLAYID
from = 8
to = 8

[[gameobject]] # GAMEOBJECT_FLAGS
from = 9
to = 9

[[gameobject]] # GAMEOBJECT_BYTES_1 byte 0 (state) -> GAMEOBJECT_STATE
from = 17
to = 14
mask = 0xFF

[[gameobject]] # GAMEOBJECT_BYTES_1 byte 1 (type) -> GAMEOBJECT_TYPE_ID
from = 17
to = 21
shift = 8
mask = 0xFF

[[gameobject]] # GAMEOBJECT_DYNAMIC low u16 (dynamic flags) -> GAMEOBJECT_DYN_FLAGS
from = 14
to = 19
mask = 0xFFFF

[[gameobject]] # GAMEOBJECT_FACTION
from = 15
to = 20

[[gameobject]] # GAMEOBJECT_LEVEL
from = 16
to = 22

# CGDynamicObjectData: caster, bytes, spell, radius share the 1.12 indices. Wrath CASTTIME (11)
# has no 1.12 slot (1.12 keeps position there).
[[dynamicobject]]
from = 6
to = 6
count = 5

# CGCorpseData -> 1.12 corpse descriptor. Wrath carries no position words; 1.12 owner, display,
# items and bytes sit two words later after its position block.
[[corpse]] # CORPSE_FIELD_OWNER
from = 6
to = 6
count = 2

[[corpse]] # CORPSE_FIELD_DISPLAY_ID
from = 10
to = 12

[[corpse]] # CORPSE_FIELD_ITEM 0..18: display | inventory type << 24
from = 11
to = 13
count = 19

[[corpse]] # BYTES_1, BYTES_2, GUILD, FLAGS, DYNAMIC_FLAGS
from = 30
to = 32
count = 5
