[package]
name = "benilla-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The client assembler: run()/run_with(), the boot, and the order the game's crates join the app in. Thin on purpose: an edit in a crate above benilla-app rebuilds that crate and this one, not the core"

[lints]
workspace = true

[features]
# `dev` compiles in the instruments; the player build (`scripts/gates.sh`) has no defaults.
default = ["dev"]
dev = ["benilla-app/dev", "benilla-souls/dev"]
tracy = ["benilla-app/tracy"]
trace_chrome = ["benilla-app/trace_chrome"]
# Links Bevy as a shared library (`benilla-app`'s feature of the same name).
bevy_dynamic_linking = ["benilla-app/bevy_dynamic_linking"]
hotpatch = ["dev", "benilla-app/hotpatch"]
# Whole-client live code under `dx serve --hot-patch` (`benilla-app`'s feature of the same name).
live_code = ["dev", "benilla-app/live_code"]

[dependencies]
# `default-features = false`, or `--no-default-features` here still builds benilla-app with `dev`.
benilla-app = { path = "../benilla-app", default-features = false }
benilla-souls = { path = "../benilla-souls", default-features = false }
benilla-assets = { path = "../benilla-assets", default-features = false }
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-world = { path = "../benilla-world", default-features = false }
bevy.workspace = true

# `tests/launcher_shape.rs` parses the manifests.
[dev-dependencies]
toml = "0.8"
