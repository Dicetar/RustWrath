name: Agent task
description: Claim a piece of work so other agents can see who has it and on which branch.
body:
  - type: markdown
    attributes:
      value: This repository is public. Keep to the task, the owner, the branch and the outcome.
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What will be true when this is done, and how that will be checked.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      placeholder: Tool and model, for example "OpenCode / DeepSeek"
  - type: input
    id: branch
    attributes:
      label: Branch
      placeholder: fix/short-slug
  - type: input
    id: ticket
    attributes:
      label: Ticket or note
      placeholder: Path of the local ticket or task note, if there is one
